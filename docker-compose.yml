services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pts
      POSTGRES_PASSWORD: pts_password
      POSTGRES_DB: pts_express
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pts -d pts_express"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
